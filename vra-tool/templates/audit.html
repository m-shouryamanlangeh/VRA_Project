{% extends "base.html" %}
{% block title %}VRA — Audit{% endblock %}
{% block body %}
<main class="max-w-6xl mx-auto px-6 py-10">
  <h1 class="text-2xl font-bold text-paytm-dark mb-6">Audit log</h1>
  <div class="flex flex-wrap gap-3 mb-6 items-end">
    <div>
      <label class="block text-xs text-slate-500 mb-1">Vendor contains</label>
      <input id="f-vendor" class="rounded border border-slate-200 px-2 py-1 text-sm" placeholder="Name" />
    </div>
    <div>
      <label class="block text-xs text-slate-500 mb-1">From (ISO)</label>
      <input id="f-from" class="rounded border border-slate-200 px-2 py-1 text-sm" placeholder="2026-01-01" />
    </div>
    <div>
      <label class="block text-xs text-slate-500 mb-1">To (ISO)</label>
      <input id="f-to" class="rounded border border-slate-200 px-2 py-1 text-sm" placeholder="2026-12-31" />
    </div>
    <button type="button" id="btn-filter" class="px-3 py-1.5 rounded bg-paytm-blue text-white text-sm font-medium">Filter</button>
    <a id="btn-csv" href="/api/audit/export.csv" class="px-3 py-1.5 rounded border border-slate-200 text-sm font-medium text-paytm-dark">Export CSV</a>
  </div>
  <div class="bg-white rounded-xl border border-slate-100 overflow-x-auto shadow-sm">
    <table class="min-w-full text-sm" id="audit-table">
      <thead>
        <tr class="bg-slate-50 text-left text-paytm-dark">
          <th class="p-2 border-b">Timestamp</th>
          <th class="p-2 border-b">Vendor</th>
          <th class="p-2 border-b">GST</th>
          <th class="p-2 border-b">Type</th>
          <th class="p-2 border-b">Status</th>
          <th class="p-2 border-b">Provider</th>
          <th class="p-2 border-b">PDF</th>
        </tr>
      </thead>
      <tbody id="audit-body"></tbody>
    </table>
  </div>
  <div class="flex justify-between items-center mt-4 text-sm text-slate-600">
    <span id="audit-meta"></span>
    <div class="flex gap-2">
      <button type="button" id="btn-prev" class="px-2 py-1 border rounded disabled:opacity-40">Prev</button>
      <button type="button" id="btn-next" class="px-2 py-1 border rounded disabled:opacity-40">Next</button>
    </div>
  </div>
</main>
{% endblock %}
{% block scripts %}<script src="/static/js/audit.js"></script>{% endblock %}
